<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chess Room</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eaf0f7;background:#0c1522}*{box-sizing:border-box}body{margin:0;padding:22px 12px}main{max-width:760px;margin:auto}h1{margin:8px 0;font-size:30px}p{color:#adbbcd}.panel{background:#172437;border:1px solid #2b3b52;border-radius:18px;padding:18px;margin:16px 0}input,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #42536c}input{background:#0d1727;color:white;max-width:100%;width:290px}button{background:#78d7b0;color:#08261e;font-weight:700;cursor:pointer}button:disabled{opacity:.4;cursor:default}.hidden{display:none!important}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.board{display:grid;grid-template-columns:repeat(8,1fr);width:min(100%,560px);aspect-ratio:1;margin:16px auto;border:5px solid #34485f;border-radius:8px;overflow:hidden}.sq{display:flex;align-items:center;justify-content:center;font-size:clamp(27px,7vw,58px);padding:0;border:0;border-radius:0;position:relative;font-family:'DejaVu Sans',serif;font-weight:400;line-height:1}.light{background:#e5e4d5}.dark{background:#7796a0}.sq.selected{background:#e9c56e}.sq.target:after{content:'';position:absolute;width:25%;height:25%;border-radius:50%;background:#193f4080;pointer-events:none}.sq.last{box-shadow:inset 0 0 0 4px #f1d66b77}.whitepiece{color:#fff;text-shadow:0 2px 3px #142231,-1px -1px #142231,1px 1px #142231}.blackpiece{color:#101927;text-shadow:0 1px 2px #fff7}.status{text-align:center;font-weight:700;font-size:19px}.small{font-size:13px}.moves{max-height:130px;overflow:auto;color:#c4d2e1;line-height:1.8;word-break:break-word}#message{color:#ffd18d;min-height:22px}#promotion{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center}#promotion .panel{text-align:center}#promotion button{font-size:34px;margin:5px}
</style></head><body><main><h1>♟ Chess Room</h1><p>合言葉でつながる、ふたりのオンラインチェス</p><section id="lobby" class="panel"><h2>対戦ルームに入る</h2><p>友達と同じ合言葉を入力してください（4文字以上）。</p><div class="row"><input id="code" type="text" maxlength="64" placeholder="合言葉を入力" autocomplete="off"><button id="join" disabled>入室する</button></div><p class="small">合言葉を知っている人が入室できます。個人情報や普段のパスワードは使わないでください。</p></section><section id="game" class="hidden"><div class="panel"><div id="role"></div><div id="status" class="status"></div><div id="board" class="board" aria-label="チェス盤"></div><div class="row"><button id="restart">再戦を希望する</button><span id="online"></span></div><p id="message"></p><div class="moves" id="moves"></div></div></section><p class="small">ブラウザを閉じると退室します。対局データはサーバー再起動時に消去されます。</p></main><div id="promotion" class="hidden"><div class="panel"><h2>昇格する駒を選択</h2><div id="promos"></div></div></div><script src="/socket.io/socket.io.js"></script><script type="module" src="/app.js"></script></body></html>
